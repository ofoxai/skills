<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Protected link</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#f3f4f0;color:#192b25;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-image:radial-gradient(ellipse at 12% 10%,#dfebe1 0,transparent 50%),radial-gradient(ellipse at 90% 95%,#eee8d9 0,transparent 45%)}main{width:100%;max-width:460px}.brand{display:flex;gap:9px;align-items:center;justify-content:center;font-size:11px;font-weight:650;letter-spacing:.17em;margin-bottom:28px;color:#61746a}.dot{height:6px;width:6px;border-radius:50%;background:#739f81}.card{background:#fffffff2;border:1px solid #ffffff;border-radius:26px;padding:38px;box-shadow:0 16px 65px #253e2410,0 2px 5px #253e2405}.icon{width:54px;height:54px;border-radius:17px;background:#edf3ed;display:grid;place-items:center;color:#446b53;margin-bottom:25px}svg{width:25px;height:25px}h1{font-size:28px;line-height:1.2;letter-spacing:-.045em;font-weight:600;margin:0 0 13px}.intro{font-size:14px;line-height:1.75;color:#718079;margin:0 0 29px}label{font-size:12px;font-weight:650;display:block;margin-bottom:11px}.digits{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.digits span{height:58px;border:1px solid #dce3dc;border-radius:10px;background:#fafbf8;display:grid;place-items:center;font-size:25px;font-weight:500;transition:border-color .15s,box-shadow .15s}.digits input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:20px;cursor:text;caret-color:transparent}.digits:focus-within span.active{border-color:#497456;box-shadow:0 0 0 3px #dfeade}.digits.invalid span{border-color:#b77665;background:#fff9f6}.digits span:empty:after{content:'·';color:#b6c1b8;font-size:22px}button{border:0;border-radius:11px;background:#244d38;color:white;font-family:inherit;font-size:14px;font-weight:600;width:100%;height:49px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:background .2s;margin-top:7px}button:hover{background:#193f2b}button:focus-visible{outline:3px solid #96b6a1;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}button svg{width:17px;height:17px}.status{min-height:38px;margin:12px 0 0;font-size:12px;line-height:1.55;color:#9b4f3b}.help{border-top:1px solid #edf0e9;padding-top:22px;margin:25px 0 0;font-size:12px;line-height:1.7;color:#829086;text-align:center}.help strong{font-weight:500;color:#55675b}footer{text-align:center;font-size:11px;line-height:1.6;color:#869187;margin-top:24px}noscript{display:block;color:#9b4f3b;font-size:13px;margin:15px 0}@media(max-width:420px){body{padding:20px}.card{padding:28px 24px;border-radius:22px}.digits{gap:7px}.digits span{height:52px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><div class="brand"><span class="dot"></span> PRIVATE SHARE</div><section class="card" aria-labelledby="heading"><div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><h1 id="heading">A little privacy, by design.</h1><p class="intro">This link is protected. Enter the six-digit access code shared with you to continue.</p><form id="form"><label for="code">Access code</label><div class="digits" id="digits"><span aria-hidden="true" class="active"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="status" required autofocus></div><p id="status" class="status" role="status" aria-live="polite"></p><button id="submit" type="submit"><span>Unlock content</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><noscript>Please enable JavaScript to verify your access code.</noscript></form><p class="help">Don't have a code?<br><strong>Ask the person who shared this link.</strong></p></section><footer>Your access stays private on this browser for one hour.</footer></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('code'),digits=document.getElementById('digits'),status=document.getElementById('status'),button=document.getElementById('submit'),label=button.querySelector('span');
function draw(){[...digits.querySelectorAll('span')].forEach((s,i)=>{s.textContent=input.value[i]||'';s.classList.toggle('active',i===Math.min(input.selectionStart??input.value.length,5))})}
input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6);digits.classList.remove('invalid');input.removeAttribute('aria-invalid');status.textContent='';draw()});input.addEventListener('keyup',draw);input.addEventListener('click',draw);
input.addEventListener('paste',e=>{e.preventDefault();input.value=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);input.dispatchEvent(new Event('input'))});
let busy=false;
form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;if(!/^\d{6}$/.test(input.value)){status.textContent='Enter all six digits to continue.';input.focus();return}busy=true;button.disabled=true;input.readOnly=true;label.textContent='Verifying…';status.textContent='';let cooldown=0;
try{const response=await fetch('/__drop/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:input.value}),credentials:'same-origin'});if(response.ok){label.textContent='You’re in';location.reload();return}const data=await response.json();status.textContent=data.message||'Unable to verify. Please try again.';if(response.status===429)cooldown=Math.min(900,Math.max(1,Number(response.headers.get('Retry-After'))||900));else{digits.classList.add('invalid');input.setAttribute('aria-invalid','true');input.select()}}
catch{status.textContent='Connection interrupted. Please try again.'}
function ready(){busy=false;button.disabled=false;input.readOnly=false;label.textContent='Unlock content';input.focus();draw()}
if(cooldown){label.textContent='Try again in '+cooldown+'s';const timer=setInterval(()=>{cooldown--;label.textContent='Try again in '+cooldown+'s';if(cooldown<=0){clearInterval(timer);ready()}},1000)}else ready()});
</script></body></html>
